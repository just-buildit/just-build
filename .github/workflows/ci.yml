name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install meson + ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build && uv tool install meson
      - name: Install meson + ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja && uv tool install meson
      - run: uv run --no-project python -m unittest tests.test_build tests.test_examples tests.test_cli tests.test_metadata -v

  test-bazel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y bazel-bootstrap && sudo ln -sf /usr/bin/bazel-bootstrap /usr/local/bin/bazel
      - run: uv run --no-project python -m unittest tests.test_examples.TestBazelExample -v

  test-just-makeit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # just-makeit (the scaffolding CLI) requires Python >=3.11 and its
        # generated projects target >=3.11, so this integration only runs on
        # 3.11+. just-buildit's 3.8+ floor is covered by the test/test-bazel
        # jobs above.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv tool install just-makeit
      - run: uv run --no-project --with pip --with numpy python -m unittest tests.test_examples.TestJustMakeitExample -v

  test-windows-ucrt64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            make
          update: true
      - shell: msys2 {0}
        run: python -m unittest tests.test_build tests.test_examples tests.test_cli -v
